<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe9f2">
  <meta name="description" content="مفاجأة صغيرة مليئة بالحب لنبأ.">
  <link rel="stylesheet" href="gift.css">
  <link rel="stylesheet" href="hearts.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="glow" aria-hidden="true"></div>
    <div class="floating-emojis" id="floating-emojis" aria-hidden="true"></div>

    <div class="stage">
      <div class="ground" aria-hidden="true"></div>
      <div class="bear" aria-hidden="true">🧸</div>

      <div class="gift" aria-hidden="true">
        <div class="gift-lid"></div>
        <div class="gift-base"></div>
      </div>

      <div class="burst-heart heart-one" aria-hidden="true">💖</div>
      <div class="burst-heart heart-two" aria-hidden="true">💕</div>
      <div class="burst-heart heart-three" aria-hidden="true">💘</div>
    </div>
  </main>

  <script src="hearts.js"></script>
  <script>
    const lid = document.querySelector(".gift-lid");
    const scene = document.getElementById("scene");
    let isRedirecting = false;

    function openNeonHeart() {
      if (isRedirecting) return;
      isRedirecting = true;
      scene.classList.add("leaving");
      window.setTimeout(() => {
        window.location.href = "neon.html";
      }, 500);
    }

    lid.addEventListener("animationend", (event) => {
      if (event.animationName !== "openLid") return;
      window.setTimeout(openNeonHeart, 350);
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      window.setTimeout(openNeonHeart, 900);
    }
  </script>
</body>
</html>
